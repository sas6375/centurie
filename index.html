<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Centurie en famille</title>
<meta name="description" content="Centurie : le jeu de prédictions de la famille. 16 questions, 1 000 jetons, aucun argent réel.">
<meta property="og:title" content="Centurie en famille">
<meta property="og:description" content="16 prédictions pour le week-end. Tes pronos restent secrets jusqu'à la clôture.">
<meta name="theme-color" content="#0B0720">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}[hidden]{display:none!important}

/* Layout: one narrow arcade column, 13 prediction cards, fixed pixel nav at the bottom. Single dark theme by choice (neon arcade). */
:root{
  color-scheme:dark;
  --bg:#0B0720; --bg2:#150A33; --panel:#170D3C; --deep:#090B22; --line:#4A3D8F;
  --fg:#F7F3FF; --mut:#C6BCEF; --red:#FF2E4D; --red-d:#6E0B1E; --cyan:#3DF2FF; --cyan-d:#1B6F78;
  --mag:#FF4FD8; --yel:#FFD84A; --white:#FFFFFF;
  --f-pix:'Press Start 2P', ui-monospace, monospace;
  --f-txt:'VT323', ui-monospace, 'Courier New', monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-txt);font-size:22px;line-height:1.15;
  background:linear-gradient(180deg,transparent 70%,rgba(255,46,77,.14) 100%) fixed,
  repeating-linear-gradient(90deg,rgba(255,79,216,.10) 0 2px,transparent 2px 39px) 0 100%/100% 30% no-repeat fixed,
  repeating-linear-gradient(0deg,rgba(255,79,216,.10) 0 2px,transparent 2px 19px) 0 100%/100% 30% no-repeat fixed,
  linear-gradient(var(--bg),var(--bg2)) fixed;
  min-height:100%}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 2px,transparent 2px 4px)}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px}
.pix{font-family:var(--f-pix);line-height:1.55;letter-spacing:0}
.mut{color:var(--mut)}
.neon{color:var(--red);text-shadow:0 0 6px var(--red),0 0 16px var(--red),3px 3px 0 var(--red-d)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--yel);outline-offset:3px}
@keyframes bl{50%{opacity:0}}
.blink{animation:bl 1s steps(1) infinite}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:18px;margin:0}
.sub{font-family:var(--f-pix);font-size:7px;color:var(--cyan);margin-top:6px;display:block}
.pill{display:flex;align-items:center;gap:8px;border:3px solid var(--yel);padding:3px 10px;background:var(--panel);color:var(--yel);font-size:23px;white-space:nowrap}
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}
.hc{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52px;background:#120A30;border:3px solid var(--line);padding:4px}
.hc b{font-family:var(--f-pix);font-size:12px;font-weight:400;color:var(--yel)}
.hc span{font-size:18px;color:var(--mut)}

/* sections */
.view{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.h2{font-family:var(--f-pix);font-size:11px;color:var(--mag);margin:6px 0 0}
.intro{background:var(--panel);border:3px solid var(--line);padding:12px 14px;font-size:22px;line-height:1.2}

/* question card */
.card{background:var(--panel);border:4px solid var(--cyan);box-shadow:5px 5px 0 var(--red);padding:14px}
.card.closed{border-color:var(--line);box-shadow:5px 5px 0 #2a2155}
.card.done{border-color:var(--mag);box-shadow:5px 5px 0 var(--cyan)}
.chead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tag{font-family:var(--f-pix);font-size:9px;color:var(--mag)}
.when{font-size:20px;color:var(--yel);text-align:right}
.qt{font-family:var(--f-txt);font-size:27px;line-height:1.1;margin:10px 0 12px;text-wrap:balance}
.opts{display:grid;gap:8px}
.opts.n2{grid-template-columns:1fr 1fr}
.opts.n3{grid-template-columns:1fr 1fr 1fr}
.opts.n4{grid-template-columns:1fr 1fr}
.opt{min-height:52px;padding:6px 8px;background:var(--deep);border:3px solid var(--line);color:var(--fg);font-family:var(--f-pix);font-size:11px;line-height:1.45}
.opt[aria-pressed="true"]{background:var(--cyan);color:var(--bg);border-color:var(--white);box-shadow:4px 4px 0 var(--mag)}
.opt:disabled{cursor:default}
.stakes{display:flex;gap:8px;margin-top:10px;align-items:center}
.stk{flex:1;min-height:44px;background:var(--panel);border:3px solid #5A4B12;color:var(--yel);font-family:var(--f-pix);font-size:11px}
.stk[aria-pressed="true"]{background:var(--yel);color:var(--bg);border-color:var(--white);box-shadow:3px 3px 0 var(--red)}
.stk:disabled{opacity:.35;cursor:default}
.del{min-width:44px;min-height:44px;background:transparent;border:3px solid var(--line);color:var(--mut);font-family:var(--f-pix);font-size:10px}
.src{font-size:19px;color:var(--mut);margin-top:10px}
.verdict{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding:6px 10px;background:var(--deep);border:3px solid var(--line);font-size:20px}
.verdict b{font-family:var(--f-pix);font-size:11px;font-weight:400}
.win{color:var(--cyan)} .lose{color:var(--red)} .void{color:var(--mut)}

/* ticket */
.ticket{background:var(--deep);border:4px dashed var(--yel);padding:14px;font-size:21px;line-height:1.2;white-space:pre-wrap;word-break:break-word;margin:0;user-select:all}
.row{display:flex;gap:10px;flex-wrap:wrap}
.cta{flex:1;display:flex;align-items:center;justify-content:center;min-height:56px;padding:0 12px;border:4px solid var(--white);background:var(--red);color:var(--white);font-family:var(--f-pix);font-size:11px;text-decoration:none;box-shadow:5px 5px 0 var(--cyan);text-shadow:2px 2px 0 #7A0F22;text-align:center}
.cta.alt{background:#25D366;color:#062b14;text-shadow:none;box-shadow:5px 5px 0 var(--mag)}
.cta.ghost{background:var(--panel);color:var(--cyan);border-color:var(--cyan);box-shadow:none;text-shadow:none}
.cta:disabled{opacity:.4;cursor:default}
.flash{font-family:var(--f-pix);font-size:9px;color:var(--cyan);min-height:14px}
.warn{background:var(--red);color:var(--white);font-family:var(--f-pix);font-size:9px;padding:8px 10px;line-height:1.6}
.ok{background:var(--panel);border:3px solid var(--cyan);color:var(--cyan);font-family:var(--f-pix);font-size:9px;padding:8px 10px;line-height:1.6}

/* scores */
.screen{background:radial-gradient(ellipse at 50% 35%,#1C2257 0%,var(--deep) 85%);border:4px solid #4A3C96;border-radius:14px;padding:10px 6px;box-shadow:5px 5px 0 var(--red)}
.hs{display:grid;grid-template-columns:44px 56px 1fr auto;align-items:center;column-gap:8px;min-height:42px;padding:0 8px;font-family:var(--f-pix);font-size:11px;font-variant-numeric:tabular-nums}
.hs.head{min-height:28px;font-size:8px;color:var(--mut)}
.hs.me{background:var(--mag);color:var(--bg)}
.hs small{font-family:var(--f-txt);font-size:18px}
.empty{font-size:20px;text-align:center;padding:18px 10px;color:var(--mut)}
.dist{display:grid;gap:10px}
.drow{background:var(--panel);border:3px solid var(--line);padding:8px 10px}
.drow .dq{font-size:21px}
.bar{display:flex;height:14px;margin-top:6px;border:2px solid var(--white)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:19px;margin-top:4px}
details{background:var(--panel);border:3px solid var(--line);padding:10px 12px}
summary{font-family:var(--f-pix);font-size:9px;color:var(--yel);cursor:pointer;min-height:24px;line-height:1.6}
textarea{width:100%;min-height:140px;background:var(--deep);color:var(--fg);border:3px solid var(--line);font-family:var(--f-txt);font-size:18px;padding:8px;margin-top:10px}
.res{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;margin-top:10px;font-size:18px}
select{background:var(--deep);color:var(--fg);border:3px solid var(--line);font-family:var(--f-txt);font-size:18px;min-height:40px;max-width:150px}

/* rules */
.rules{display:grid;gap:10px}
.rule{background:var(--panel);border:3px solid var(--line);padding:12px 14px;font-size:22px;line-height:1.2}
.rule b{font-family:var(--f-pix);font-size:10px;font-weight:400;color:var(--yel);display:block;margin-bottom:6px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:4px solid var(--mag);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ni{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:54px;background:transparent;border:0;color:var(--fg);font-family:var(--f-pix);font-size:8px}
.ni[aria-current="page"]{background:var(--mag);color:var(--bg)}
.dot{position:absolute;top:4px;right:14px;width:10px;height:10px;background:var(--red);border:2px solid var(--white)}

/* start screen */
.start{position:fixed;inset:0;z-index:60;background:linear-gradient(var(--bg),var(--bg2));overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.start .in{max-width:420px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.slots{display:flex;gap:14px}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px}
.arr{width:64px;min-height:44px;background:var(--panel);border:3px solid var(--cyan);color:var(--cyan);font-family:var(--f-pix);font-size:12px}
.let{display:flex;align-items:center;justify-content:center;width:64px;height:72px;background:var(--deep);border:4px solid var(--yel);font-family:var(--f-pix);font-size:30px;color:var(--yel);text-shadow:3px 3px 0 #7A5A00}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:45;max-width:min(440px,calc(100% - 32px));background:var(--cyan);color:var(--bg);border:3px solid var(--white);box-shadow:4px 4px 0 var(--mag);font-family:var(--f-pix);font-size:9px;line-height:1.6;padding:8px 12px;text-align:center}
.toast.bad{background:var(--red);color:var(--white);box-shadow:4px 4px 0 var(--cyan)}
#banner{margin-top:14px}
.who{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:19px}
.chip{font-family:var(--f-pix);font-size:8px;padding:5px 6px;border:2px solid var(--line);color:var(--mut)}
.chip.in{background:var(--cyan);color:var(--bg);border-color:var(--cyan)}
.grid-wrap{overflow-x:auto;border:4px solid var(--line);background:var(--deep)}
.grid{border-collapse:collapse;font-variant-numeric:tabular-nums;width:100%}
.grid th,.grid td{border:1px solid #2a2155;text-align:center;padding:0;height:34px;min-width:34px}
.grid thead th{font-family:var(--f-pix);font-size:8px;color:var(--fg);padding:6px 2px;position:sticky;top:0;background:var(--panel)}
.grid thead th.me{background:var(--mag);color:var(--bg)}
.grid th.q{text-align:left;font-family:var(--f-txt);font-size:18px;padding:0 8px;white-space:nowrap;position:sticky;left:0;background:var(--panel);min-width:0}
.grid td.y{background:rgba(61,242,255,.18);color:var(--cyan);font-family:var(--f-pix);font-size:10px}
.grid td.n{color:#4a3d8f;font-size:18px}
.grid tfoot th,.grid tfoot td{font-family:var(--f-pix);font-size:8px;color:var(--yel);background:var(--panel)}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:19px}
</style>
</head>

  var left=q.t-now;
  if(left<=0) return "FIGÉE";
  if(left<6*3600000){var h=Math.floor(left/3600000),m=Math.floor(left%3600000/60000);return "SE FIGE DANS "+(h?h+"H":"")+pad(m)+"M";}
  var d=new Date(q.t+3600000);
  return "CLÔT. "+JOURS[d.getUTCDay()]+" "+pad(d.getUTCDate())+"/"+pad(d.getUTCMonth()+1)+" "+d.getUTCHours()+"H"+(d.getUTCMinutes()?pad(d.getUTCMinutes()):"");
}
function staked(){var s=0;for(var k in me.picks)s+=me.picks[k].s;return s;}
var toastT=null;
function toast(msg,bad){var t=document.getElementById("toast");t.textContent=msg;t.className="toast"+(bad?" bad":"");t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},bad?4500:1600);}
function banner(msg){var b=document.getElementById("banner");b.textContent=msg;b.hidden=!msg;}
function errMsg(e){var m=(e&&e.message)||"";
  if(/Budget/.test(m)) return "BUDGET DÉPASSÉ : BAISSE UNE AUTRE MISE.";
  if(/row-level security|violates/.test(m)) return "QUESTION FIGÉE : PRONO REFUSÉ.";
  if(/duplicate key|unique/.test(m)) return "INITIALES DÉJÀ PRISES : CHANGE UNE LETTRE.";
  if(/Anonymous sign-ins are disabled/i.test(m)) return "CONNEXION ANONYME DÉSACTIVÉE DANS SUPABASE.";
  return "ERREUR RÉSEAU : RÉESSAIE.";}

/* ===== données ===== */
async function loadAll(){
  var r=await Promise.all([
    sb.from("players").select("user_id,initials"),
    sb.from("predictions").select("user_id,question_id,option,stake"),
    sb.from("results").select("question_id,outcome"),
    sb.from("admins").select("user_id").eq("user_id",uid),
    sb.rpc("participation")
  ]);
  for(var i=0;i<3;i++) if(r[i].error) throw r[i].error;
  cache.players=r[0].data||[];cache.preds=r[1].data||[];cache.results={};
  (r[2].data||[]).forEach(function(x){cache.results[x.question_id]=x.outcome==="x"?"x":+x.outcome;});
  isAdmin=!!(r[3].data&&r[3].data.length);
  cache.part=(r[4]&&!r[4].error&&r[4].data)||[];
  me.picks={};
  cache.preds.forEach(function(p){if(p.user_id===uid)me.picks[p.question_id]={o:p.option,s:p.stake};});
  var mine=cache.players.filter(function(p){return p.user_id===uid;})[0];
  me.ini=mine?mine.initials:"";
}
async function savePick(id){
  var p=me.picks[id],r;
  render();
  if(p) r=await sb.from("predictions").upsert({user_id:uid,question_id:id,option:p.o,stake:p.s},{onConflict:"user_id,question_id"});
  else r=await sb.from("predictions").delete().eq("user_id",uid).eq("question_id",id);
  if(r.error){toast(errMsg(r.error),true);try{await loadAll();}catch(e){}}
  else toast(p?"PRONO ENREGISTRÉ":"PRONO RETIRÉ");
  render();
}

function played(qid){var set={};cache.part.forEach(function(x){if(x.question_id===qid)set[x.user_id]=1;});if(me.picks[qid])set[uid]=1;else delete set[uid];return set;}
/* ===== calcul des scores (pari mutuel, sur les questions figées) ===== */
function compute(){
  var now=Date.now(),res=cache.results,pools={},bets={};
  cache.players.forEach(function(p){bets[p.user_id]={};});
  cache.preds.forEach(function(p){(bets[p.user_id]=bets[p.user_id]||{})[p.question_id]={o:p.option,s:p.stake};});
  Q.forEach(function(q){if(q.t>now)return;var pl={tot:0,by:[0,0,0,0],n:[0,0,0,0]};
    Object.keys(bets).forEach(function(u){var b=bets[u][q.id];if(b){pl.tot+=b.s;pl.by[b.o]+=b.s;pl.n[b.o]++;}});pools[q.id]=pl;});
  function outcome(q,b){var r=res[q.id];
    if(r==="x")return {ret:b.s,gain:0,kind:"void"};
    if(b.o!==r)return {ret:0,gain:-b.s,kind:"lose"};
    var pl=pools[q.id],p=pl.by[r]/pl.tot*100;
    var g=Math.min(10*b.s,b.s*100/p-b.s);if(p<50)g+=20;g=Math.round(g);
    return {ret:b.s+g,gain:g,kind:"win"};}
  var rows=cache.players.map(function(p){var sc=START,live=0,wins=0;
    Q.forEach(function(q){var b=bets[p.user_id]&&bets[p.user_id][q.id];if(!b||q.t>now)return;sc-=b.s;
      if(res[q.id]===undefined)live+=b.s;else{var o=outcome(q,b);sc+=o.ret;if(o.kind==="win")wins++;}});
    return {uid:p.user_id,ini:p.initials,score:sc,live:live,wins:wins};
  }).sort(function(a,b){return (b.score+b.live)-(a.score+a.live)||b.wins-a.wins||a.ini.localeCompare(b.ini);});
  return {rows:rows,pools:pools,bets:bets,res:res,outcome:outcome};
}

/* ===== rendu ===== */
function hud(C){
  var mine=C.rows.filter(function(r){return r.uid===uid;})[0];
  document.getElementById("pill-n").textContent=fmt(START-staked());
  var done=Q.filter(function(q){return C.res[q.id]!==undefined;}).length;
  var rank=mine?C.rows.indexOf(mine)+1:0;
  document.getElementById("hud").innerHTML=
    '<div class="hc"><b>'+(me.ini||"???")+'</b><span>'+(rank?rank+(rank===1?"ER":"E")+" / "+C.rows.length:"JOUEUR")+'</span></div>'+
    '<div class="hc"><b>'+Object.keys(me.picks).length+'/'+Q.length+'</b><span>PRONOS</span></div>'+
    '<div class="hc"><b>'+(mine?fmt(mine.score+mine.live):"—")+'</b><span>SCORE</span></div>';
}
function renderJouer(C){
  var now=Date.now(),free=START-staked(),h="";
  h+='<div class="intro">Choisis ta réponse puis ta mise : tout s\'enregistre tout seul. <b style="color:var(--yel)">Tes pronos restent secrets</b> jusqu\'à la clôture de chaque question ; ensuite, tout le monde voit ce qu\'a joué la famille.</div>';
  var open=Q.filter(function(q){return q.t>now;}).sort(function(a,b){return a.t-b.t;});
  var closed=Q.filter(function(q){return q.t<=now;}).sort(function(a,b){return b.t-a.t;});
  if(open.length)h+='<h2 class="h2">OUVERTES · '+open.length+'</h2>';
  open.forEach(function(q){h+=card(q,C,now,free);});
  if(closed.length)h+='<h2 class="h2">FIGÉES · '+closed.length+'</h2>';
  closed.forEach(function(q){h+=card(q,C,now,free);});
  view.innerHTML=h;
}
var COLS=["var(--cyan)","var(--red)","var(--yel)","var(--mag)"];
function card(q,C,now,free){
  var p=me.picks[q.id],isClosed=q.t<=now,r=C.res[q.id],resolved=r!==undefined;
  var h='<article class="card'+(resolved?" done":isClosed?" closed":"")+'"><div class="chead"><span class="tag">'+q.id+' · '+q.th+'</span><span class="when'+(q.t-now<6*3600000&&!isClosed?' blink':'')+'">'+closeLabel(q,now)+'</span></div>';
  h+='<p class="qt">'+esc(q.q)+'</p><div class="opts n'+q.o.length+'">';
  q.o.forEach(function(o,i){h+='<button class="opt" data-q="'+q.id+'" data-o="'+i+'" aria-pressed="'+(!!p&&p.o===i)+'"'+(isClosed?' disabled':'')+'>'+o+'</button>';});
  h+='</div>';
  if(!isClosed&&p){
    h+='<div class="stakes" role="group" aria-label="Mise">';
    STAKES.forEach(function(s){var can=s<=free+p.s;h+='<button class="stk" data-q="'+q.id+'" data-s="'+s+'" aria-pressed="'+(p.s===s)+'"'+(can?'':' disabled')+'>'+s+'</button>';});
    h+='<button class="del" data-del="'+q.id+'" aria-label="Retirer mon prono">X</button></div>';
  }
  if(!isClosed&&cache.players.length){
    var pls=played(q.id),nb=Object.keys(pls).length;
    h+='<div class="who"><span class="mut">'+nb+'/'+cache.players.length+' ONT JOUÉ :</span>';
    cache.players.forEach(function(pl){h+='<span class="chip'+(pls[pl.user_id]?' in':'')+'">'+esc(pl.initials)+'</span>';});
    h+='</div>';
  }
  if(isClosed){
    var pl=C.pools[q.id];
    if(pl&&pl.tot){h+='<div class="bar" style="margin-top:12px">';q.o.forEach(function(o,i){var w=pl.by[i]/pl.tot*100;if(w)h+='<span style="width:'+w+'%;background:'+COLS[i]+'"></span>';});
      h+='</div><div class="legend"><span class="mut">LA FAMILLE :</span>';q.o.forEach(function(o,i){h+='<span style="color:'+COLS[i]+'">'+o+' '+Math.round(pl.by[i]/pl.tot*100)+'% ('+pl.n[i]+')</span>';});h+='</div>';}
    if(resolved){
      var lbl=r==="x"?"ANNULÉE":q.o[r],out="";
      if(p){var o=C.outcome(q,p);out=o.kind==="win"?'<b class="win">+'+fmt(o.gain)+'</b>':o.kind==="void"?'<b class="void">REMBOURSÉ</b>':'<b class="lose">−'+fmt(p.s)+'</b>';}
      h+='<div class="verdict"><span>RÉSULTAT : <span class="pix" style="font-size:11px;color:var(--cyan)">'+lbl+'</span></span>'+out+'</div>';
    } else if(p){
      h+='<div class="verdict"><span>Ton prono : '+q.o[p.o]+' · '+p.s+'</span><b class="mut">EN ATTENTE</b></div>';
    }
  }
  h+='<div class="src">Source : '+esc(q.src)+'</div></article>';
  return h;
}
function renderScores(C){
  var h='<h2 class="h2">HIGH SCORES</h2><div class="screen"><div class="hs head"><span>RANG</span><span>NOM</span><span>EN JEU</span><span>SCORE</span></div>';
  if(!C.rows.length)h+='<div class="empty">Aucun joueur pour l\'instant.</div>';
  var ranks=["1ST","2ND","3RD"];
  C.rows.forEach(function(r,i){var col=i===0?"var(--yel)":i===1?"var(--fg)":i===2?"#FF9F1C":"var(--cyan)";
    h+='<div class="hs'+(r.uid===uid?' me':'')+'" style="'+(r.uid===uid?'':'color:'+col)+'"><span>'+(ranks[i]||(i+1)+"TH")+'</span><span>'+esc(r.ini)+'</span><small>'+(r.live?fmt(r.live):"—")+'</small><span>'+fmt(r.score+r.live)+'</span></div>';});
  h+='</div><p class="mut" style="margin:0;font-size:19px">Score = 1 000 + gains − pertes sur les questions figées. Les mises sur les questions encore ouvertes restent secrètes et ne comptent pas encore.</p>';
  if(isAdmin){
    h+='<details open><summary>RÉSULTATS (ADMIN)</summary><div class="res">';
    Q.forEach(function(q){var v=C.res[q.id];v=v===undefined?"":String(v);
      h+='<label for="r'+q.id+'">'+q.id+'. '+esc(q.q.length>46?q.q.slice(0,44)+"…":q.q)+'</label><select id="r'+q.id+'" data-r="'+q.id+'"><option value="">—</option>';
      q.o.forEach(function(o,i){h+='<option value="'+i+'"'+(v===String(i)?' selected':'')+'>'+o+'</option>';});
      h+='<option value="x"'+(v==="x"?' selected':'')+'>ANNULÉE</option></select>';});
    h+='</div></details>';
  }
  view.innerHTML=h;
}
function renderGroupe(C){
  var now=Date.now(),pl=cache.players.slice().sort(function(a,b){return a.user_id===uid?-1:b.user_id===uid?1:a.initials.localeCompare(b.initials);});
  var h='<h2 class="h2">QUI A JOUÉ</h2><div class="intro">Comme un Doodle : <b style="color:var(--cyan)">✓</b> = a joué, réponse secrète jusqu\'à la clôture. Ensuite, la case montre son choix.</div>';
  if(!pl.length){view.innerHTML=h+'<div class="empty">Aucun joueur pour l\'instant.</div>';return;}
  var qs=Q.slice().sort(function(a,b){return a.t-b.t;});
  h+='<div class="grid-wrap"><table class="grid"><thead><tr><th class="q">QUESTION</th>';
  pl.forEach(function(p){h+='<th'+(p.user_id===uid?' class="me"':'')+'>'+esc(p.initials)+'</th>';});
  h+='</tr></thead><tbody>';
  var tot={};pl.forEach(function(p){tot[p.user_id]=0;});
  qs.forEach(function(q){var pls=played(q.id),closed=q.t<=now;
    h+='<tr><th class="q" scope="row">'+q.id+'. '+esc(q.th.split(' · ')[0])+(closed?' <span class="mut">(FIGÉE)</span>':'')+'</th>';
    pl.forEach(function(p){var did=!!pls[p.user_id];if(did)tot[p.user_id]++;
      var b=C.bets[p.user_id]&&C.bets[p.user_id][q.id];
      if(closed&&b){h+='<td class="y" style="background:'+COLS[b.o]+';color:var(--bg)" title="'+esc(q.o[b.o])+'">'+"ABCD"[b.o]+'</td>';}
      else h+=did?'<td class="y">✓</td>':'<td class="n">·</td>';});
    h+='</tr>';});
  h+='</tbody><tfoot><tr><th class="q">TOTAL</th>';
  pl.forEach(function(p){h+='<td>'+tot[p.user_id]+'</td>';});
  h+='</tr></tfoot></table></div>';
  h+='<div class="leg"><span class="mut">Après clôture :</span><span style="color:var(--cyan)">A = 1re réponse</span><span style="color:var(--red)">B = 2e</span><span style="color:var(--yel)">C = 3e</span><span style="color:var(--mag)">D = 4e</span></div>';
  var lazy=pl.filter(function(p){return p.user_id!==uid&&tot[p.user_id]===0;});
  if(lazy.length)h+='<div class="ok">PAS ENCORE JOUÉ : '+lazy.map(function(p){return esc(p.initials);}).join(", ")+'. RELANCE-LES DANS LE GROUPE !</div>';
  view.innerHTML=h;
}
function renderRegles(){
  view.innerHTML='<div class="rules">'+
  '<div class="rule"><b>1. TES JETONS</b>1 000 jetons virtuels pour tout le test. Mise 50, 100 ou 250 par question. Aucun argent réel.</div>'+
  '<div class="rule"><b>2. SECRET JUSQU\'À LA CLÔTURE</b>Tes pronos s\'enregistrent tout seuls et tu peux les changer jusqu\'à la clôture. Personne ne voit ceux des autres avant ; ensuite la répartition de la famille s\'affiche sur la question.</div>'+
  '<div class="rule"><b>3. LA COTE, C\'EST LA FAMILLE</b>Si tu as raison : gain = mise × 100 / part des jetons sur ta réponse − mise. Moins vous êtes de ton avis, plus ça rapporte. Exemple : 100 jetons sur une réponse qui pèse 40 % → +150.</div>'+
  '<div class="rule"><b>4. BONUS CONTRE-COURANT</b>+20 jetons si tu gagnes avec le camp minoritaire (moins de 50 %).</div>'+
  '<div class="rule"><b>5. LES RÉSULTATS</b>Chaque question cite sa source. Si l\'événement n\'a pas lieu, la question est annulée et la mise rendue. Résultats complets mardi 3 novembre au soir.</div>'+
  '<div class="rule"><b>6. TON COMPTE</b>Il est lié à ce téléphone et ce navigateur : joue toujours depuis le même.</div>'+
  '<button class="cta ghost" id="rename">CHANGER D\'INITIALES</button></div>';
}
function render(){
  var C=compute();hud(C);
  document.querySelectorAll(".ni").forEach(function(b){if(b.dataset.go===tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
  if(!sb){return;}
  if(tab==="jouer")renderJouer(C);else if(tab==="groupe")renderGroupe(C);else if(tab==="scores")renderScores(C);else renderRegles();
}

/* ===== écran de départ ===== */
function drawSlots(){var h="";for(var i=0;i<3;i++){h+='<div class="slot"><button class="arr" data-l="'+i+'" data-d="1" aria-label="Lettre suivante, case '+(i+1)+'">▲</button><span class="let" aria-live="polite">'+A[letters[i]]+'</span><button class="arr" data-l="'+i+'" data-d="-1" aria-label="Lettre précédente, case '+(i+1)+'">▼</button></div>';}document.getElementById("slots").innerHTML=h;}
function showStart(){if(me.ini)letters=me.ini.split("").map(function(c){return Math.max(0,A.indexOf(c));});drawSlots();document.getElementById("start-msg").textContent="";document.getElementById("start").hidden=false;}
document.getElementById("slots").addEventListener("click",function(e){var b=e.target.closest(".arr");if(!b)return;var i=+b.dataset.l;letters[i]=(letters[i]+(+b.dataset.d)+26)%26;drawSlots();});
document.getElementById("press").addEventListener("click",async function(){
  var ini=letters.map(function(i){return A[i];}).join(""),btn=this;btn.disabled=true;
  var r=await sb.from("players").upsert({user_id:uid,initials:ini},{onConflict:"user_id"});
  btn.disabled=false;
  if(r.error){document.getElementById("start-msg").textContent=errMsg(r.error);return;}
  me.ini=ini;try{await loadAll();}catch(e){}
  document.getElementById("start").hidden=true;render();
});

/* ===== interactions ===== */
document.querySelector(".nav").addEventListener("click",async function(e){var b=e.target.closest(".ni");if(!b)return;tab=b.dataset.go;try{history.replaceState(null,"","#"+tab);}catch(x){}render();window.scrollTo(0,0);if(sb){try{await loadAll();render();}catch(x){}}});
view.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.classList.contains("opt")){var id=+t.dataset.q,o=+t.dataset.o,p=me.picks[id],free=START-staked();
    if(p){if(p.o===o)return;p.o=o;}else{var s=STAKES.filter(function(x){return x<=free;});if(!s.length){toast("PLUS ASSEZ DE JETONS : BAISSE UNE AUTRE MISE.",true);return;}me.picks[id]={o:o,s:s.indexOf(100)>-1?100:s[s.length-1]};}
    savePick(id);return;}
  if(t.classList.contains("stk")){var q=+t.dataset.q;if(me.picks[q].s===+t.dataset.s)return;me.picks[q].s=+t.dataset.s;savePick(q);return;}
  if(t.dataset.del){delete me.picks[+t.dataset.del];savePick(+t.dataset.del);return;}
  if(t.id==="rename"){showStart();return;}
});
view.addEventListener("change",async function(e){var s=e.target.closest("select[data-r]");if(!s)return;var id=+s.dataset.r,v=s.value,r;
  if(v==="")r=await sb.from("results").delete().eq("question_id",id);
  else r=await sb.from("results").upsert({question_id:id,outcome:v},{onConflict:"question_id"});
  if(r.error)toast(errMsg(r.error),true);else toast("RÉSULTAT ENREGISTRÉ");
  try{await loadAll();}catch(x){}render();});

/* ===== démarrage ===== */
async function boot(){
  var h=(location.hash||"").slice(1);if(["jouer","groupe","scores","regles"].indexOf(h)>-1)tab=h;
  if(!window.supabase||SUPABASE_URL.indexOf("http")!==0){banner("JEU PAS ENCORE BRANCHÉ À SA BASE. REVIENS UN PEU PLUS TARD.");view.innerHTML="";return;}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  try{
    var s=(await sb.auth.getSession()).data.session;
    if(!s){var a=await sb.auth.signInAnonymously();if(a.error)throw a.error;s=a.data.session;}
    uid=s.user.id;
    await loadAll();
    render();
    if(!me.ini)showStart();
  }catch(e){banner(errMsg(e));view.innerHTML='<div class="empty">Impossible de charger la partie. Vérifie ta connexion puis recharge la page.</div>';}
  setInterval(function(){if(!sb||!uid)return;if(document.querySelector("select:focus"))return;loadAll().then(render).catch(function(){});},90000);
  setInterval(function(){if(tab==="jouer"&&uid)render();},60000);
}
boot();
})();
</script>
